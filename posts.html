<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="全部文章 · 支持搜索、分类与标签筛选。">
  <title>文章 · 清风个人页</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070A0F'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%234FE3C1' font-family='sans-serif'%3E%E6%B8%85%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/scifi.css">
  <script>/* 首屏前定主题，避免深色用户闪白 */
  (function(){var m=localStorage.getItem("theme")||"dark";var d=m==="dark"||(m==="system"&&window.matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.setAttribute("data-theme",d?"dark":"light");})();
  </script>
</head>
<body data-page="posts">
  <header class="site-header" id="site-header"></header>

  <main class="container wide">
    <div class="meta-line" style="margin-bottom:0.4rem"><span class="index-chip">02</span><span>文章归档</span></div>
    <h1 style="margin-bottom:1.2rem">全部文章</h1>

    <div class="toolbar">
      <input class="search-input" id="search-input" type="search" placeholder="搜索标题、摘要、标签…" autocomplete="off">
    </div>
    <div class="toolbar">
      <div class="filter-group" id="cat-bar"></div>
    </div>
    <div class="toolbar" style="margin-bottom:1.6rem">
      <div class="filter-group" id="tag-cloud"></div>
    </div>

    <div class="meta-line" style="margin-bottom:0.8rem"><span class="index-chip">结果</span><span id="result-count">0</span> 篇</div>
    <div class="post-grid" id="post-list"></div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="data/site.js"></script>
  <script src="data/posts.js"></script>
  <script src="assets/md.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/fx.js"></script>
</body>
</html>
