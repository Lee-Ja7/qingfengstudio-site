<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="全站搜索 · 清风个人页">
  <title>搜索 · 清风个人页</title>
  <link rel="icon" type="image/png" href="assets/app-icon.png">
  <link rel="apple-touch-icon" href="assets/app-icon.png">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/scifi.css">
  <script>/* 首屏前定主题，避免深色用户闪白 */
  (function(){var m=localStorage.getItem("theme")||"dark";var d=m==="dark"||(m==="system"&&window.matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.setAttribute("data-theme",d?"dark":"light");})();
  </script>
</head>
<body data-page="search">
  <header class="site-header" id="site-header"></header>

  <main class="container wide">
    <div class="meta-line" style="margin-bottom:0.4rem"><span class="index-chip">07</span><span>search</span></div>
    <h1 style="margin-bottom:1.2rem">搜索</h1>
    <div class="toolbar" style="margin-bottom:1.5rem">
      <input class="search-input" id="search-input" type="search" placeholder="搜标题、摘要、标签、正文…" autocomplete="off" autofocus>
    </div>
    <div class="post-grid" id="post-list"></div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="data/site.js"></script>
  <script src="data/posts.js"></script>
  <script src="assets/md.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/fx.js"></script>
</body>
</html>
